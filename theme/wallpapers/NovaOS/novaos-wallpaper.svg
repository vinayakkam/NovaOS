<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160">
  <!-- NovaOS default wallpaper. Original artwork: soft gradient with flowing ribbons. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dfe9ff"/>
      <stop offset="0.55" stop-color="#b9c8f5"/>
      <stop offset="1" stop-color="#9aa6e8"/>
    </linearGradient>
    <linearGradient id="r1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f8cff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#4f8cff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#7a4dff" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="r2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a4dff" stop-opacity="0.0"/>
      <stop offset="0.6" stop-color="#a978ff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ff8fd1" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="160"/>
    </filter>
  </defs>
  <rect width="3840" height="2160" fill="url(#bg)"/>
  <circle cx="2900" cy="700" r="620" fill="#ffffff" opacity="0.55" filter="url(#glow)"/>
  <path d="M-200 1700 C 700 1250, 1500 1900, 2400 1350 S 3700 700, 4100 900 L 4100 1250 C 3600 1100, 3100 1500, 2400 1750 S 800 1700, -200 2100 Z"
        fill="url(#r1)" filter="url(#soft)"/>
  <path d="M-200 1900 C 900 1500, 1700 2050, 2600 1600 S 3600 1150, 4100 1300 L 4100 1500 C 3500 1400, 3000 1800, 2500 1950 S 900 1950, -200 2200 Z"
        fill="url(#r2)" filter="url(#soft)"/>
</svg>
