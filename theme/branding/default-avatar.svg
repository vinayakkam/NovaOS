<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- NovaOS default account picture: a generic person silhouette on a soft grey disc.
       Original artwork. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9dde7"/>
      <stop offset="1" stop-color="#a9b1c4"/>
    </linearGradient>
    <clipPath id="disc"><circle cx="128" cy="128" r="128"/></clipPath>
  </defs>
  <circle cx="128" cy="128" r="128" fill="url(#bg)"/>
  <g clip-path="url(#disc)" fill="#ffffff" fill-opacity="0.92">
    <circle cx="128" cy="100" r="46"/>
    <path d="M38 256c0-58 40-96 90-96s90 38 90 96z"/>
  </g>
</svg>
